[project]
name = "agentos"
version = "0.1.0"
description = "AgentOS V2: tickets, context and agent runs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.5",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentos", "src/agentos_worker", "src/agentos_protocol"]

[dependency-groups]
dev = [
    "complexipy>=8.0.1",
    "httpx2>=2.13.1",
    "import-linter>=2.15",
    "lizard>=1.24.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.agentos]
# The fast suite's wall time limit (tests/speed_gate.py, registered by the root conftest.py). Make slow tests faster; don't raise it.
fast_suite_limit_s = 10

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
# The worker runs on Python 3.11 runners, and the server shares its protocol package.
target-version = "py311"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF", "PT", "ASYNC", "C4", "RET", "PTH", "ERA", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["agentos", "agentos_worker", "agentos_protocol"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = ["src", "tools/gates"]
explicit_package_bases = true
files = ["src", "tests", "tools", "conftest.py"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests", "tools/gates"]
addopts = "-q --strict-markers"
markers = ["integration: real processes and real git (just test-integration)"]

# ---------------------------------------------------------------- import-linter
# The module map (docs/architecture.md › Modules): each package's "uses" list is the only packages
# it may import. The pure `workflows` and `agentos_protocol`, and `db`, are open to every package
# above them, except that workflows, the protocol, program, targets and the HTTP clients never
# use the database.
[tool.importlinter]
root_packages = ["agentos", "agentos_worker", "agentos_protocol"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The module map's order, highest first; every package is on it"
type = "layers"
containers = ["agentos"]
exhaustive = true
layers = [
    "__main__",
    "app",
    "board | admin",
    "journal",
    "runs",
    "targets",
    "context",
    "tickets",
    "people",
    "settings",
    "program",
    "jira | github | artifactory",
    "workflows",
    "db",
]
broken_contract_guidance = "A package uses only rows below it, and a new package joins the map first (docs/architecture.md, Modules). Move the shared piece down, or pass the value in."

[[tool.importlinter.contracts]]
name = "db uses nothing"
type = "forbidden"
source_modules = ["agentos.db"]
forbidden_modules = ["agentos_protocol", "agentos_worker"]
[[tool.importlinter.contracts]]
name = "board uses runs, context, tickets, settings, people, jira"
type = "forbidden"
source_modules = ["agentos.board"]
forbidden_modules = ["agentos.journal", "agentos.targets", "agentos.program", "agentos.github", "agentos.artifactory"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "admin uses context, tickets, settings, jira"
type = "forbidden"
source_modules = ["agentos.admin"]
forbidden_modules = ["agentos.journal", "agentos.runs", "agentos.targets", "agentos.people", "agentos.program", "agentos.github", "agentos.artifactory"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "journal uses runs, context, people, targets, program"
type = "forbidden"
source_modules = ["agentos.journal"]
forbidden_modules = ["agentos.tickets", "agentos.settings", "agentos.jira", "agentos.github", "agentos.artifactory"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "runs uses context, tickets, settings, people, targets, program"
type = "forbidden"
source_modules = ["agentos.runs"]
forbidden_modules = ["agentos.jira", "agentos.github", "agentos.artifactory"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "targets uses github, artifactory, and no database"
type = "forbidden"
source_modules = ["agentos.targets"]
forbidden_modules = ["agentos.context", "agentos.tickets", "agentos.people", "agentos.settings", "agentos.program", "agentos.jira", "agentos.db"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "context uses tickets, settings"
type = "forbidden"
source_modules = ["agentos.context"]
forbidden_modules = ["agentos.people", "agentos.program", "agentos.jira", "agentos.github", "agentos.artifactory"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "tickets uses people, settings"
type = "forbidden"
source_modules = ["agentos.tickets"]
forbidden_modules = ["agentos.program", "agentos.jira", "agentos.github", "agentos.artifactory"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "people uses settings, jira"
type = "forbidden"
source_modules = ["agentos.people"]
forbidden_modules = ["agentos.program", "agentos.github", "agentos.artifactory"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "settings uses nothing"
type = "forbidden"
source_modules = ["agentos.settings"]
forbidden_modules = ["agentos.program", "agentos.jira", "agentos.github", "agentos.artifactory"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "program uses nothing, and no database"
type = "forbidden"
source_modules = ["agentos.program"]
forbidden_modules = ["agentos.jira", "agentos.github", "agentos.artifactory", "agentos.db"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The HTTP clients and workflows never use the database"
type = "forbidden"
source_modules = ["agentos.jira", "agentos.github", "agentos.artifactory", "agentos.workflows"]
forbidden_modules = ["agentos.db"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The core (model, rules, at any depth) uses no shell, boundary, database, HTTP client or app"
type = "forbidden"
source_modules = ["agentos.**.model", "agentos.**.rules"]
forbidden_modules = [
    "agentos.**.service", "agentos.**.loops", "agentos.**.reaper", "agentos.**.dispatcher",
    "agentos.**.routes", "agentos.**.rows",
    "agentos.db", "agentos.jira", "agentos.github", "agentos.artifactory", "agentos.app",
    # `agentos.app` alone doesn't reach a core module inside app (app.model): its siblings do.
    "agentos.app.**",
]
broken_contract_guidance = "The core is pure: it takes parsed values as arguments. Load in the service and pass them in."

[[tool.importlinter.contracts]]
name = "The core uses no web framework, HTTP client or Pydantic"
type = "forbidden"
source_modules = [
    "agentos.**.model", "agentos.**.rules", "agentos.workflows", "agentos_protocol",
    "agentos_worker.core",
]
forbidden_modules = ["fastapi", "starlette", "uvicorn", "httpx2", "pydantic"]
broken_contract_guidance = "Parse at the boundary into the core's own types and pass those in."

[[tool.importlinter.contracts]]
name = "Inside the worker: run and client above its boundaries above its core; nothing else"
type = "layers"
containers = ["agentos_worker"]
exhaustive = true
layers = ["__main__", "(run) | (client)", "(http) | (git) | (procs) | (files)", "core"]

[[tool.importlinter.contracts]]
name = "The server never imports the worker"
type = "forbidden"
source_modules = ["agentos"]
forbidden_modules = ["agentos_worker"]
broken_contract_guidance = "The server shares only agentos_protocol with the worker. program finds the worker's files by path."

[[tool.importlinter.contracts]]
name = "The worker and the protocol never import the server"
type = "forbidden"
source_modules = ["agentos_worker", "agentos_protocol"]
forbidden_modules = ["agentos"]

[[tool.importlinter.contracts]]
name = "The protocol imports nothing of ours"
type = "forbidden"
source_modules = ["agentos_protocol"]
forbidden_modules = ["agentos_worker"]